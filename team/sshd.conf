# sshd settings for the evcrawl dev container (AGENTS.md §4).
# Host keys live on the `sshhost` volume so the fingerprint survives rebuilds.
HostKey /etc/ssh/host_keys/ssh_host_ed25519_key
HostKey /etc/ssh/host_keys/ssh_host_rsa_key
Port 22
AddressFamily any
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowGroups team
# Keys come from team/keys/ only, root-owned (F-011): a member cannot add one.
AuthorizedKeysFile /etc/ssh/authorized_keys.d/%u
StrictModes yes
X11Forwarding no
# Forwarding (F-010): local forwards only, to the container itself (editors'
# Remote-SSH servers, a member's own `evcrawl api`) and to db/redis for
# editor database tooling; no remote listens, no agent forwarding (GitHub
# goes through `gh auth login` or a key in the member's own ~/.ssh).
AllowAgentForwarding no
AllowTcpForwarding local
PermitOpen localhost:* 127.0.0.1:* [::1]:* db:5432 redis:6379
PermitListen none
PermitTunnel no
ClientAliveInterval 60
ClientAliveCountMax 3
LoginGraceTime 30
MaxAuthTries 4
UsePAM yes
PrintMotd yes
AcceptEnv LANG LC_*
