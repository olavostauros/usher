name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# One run per PR head. Agents add `automerge` right after `gh pr create`, so the
# `labeled` run starts while the `opened` one is still going; the newer run
# cancels the older and does everything (gates, then the merge). A label other
# than `automerge` gets a group of its own and runs nothing (the jobs' `if`),
# so it never cancels a real run. Pushes to main are never cancelled.
concurrency:
  group: >-
    ci-${{ github.event.pull_request.number || github.ref }}${{
    github.event.action == 'labeled' && github.event.label.name != 'automerge'
    && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates-in-dev-image:
    name: gates (dev image)
    if: github.event.action != 'labeled' || github.event.label.name == 'automerge'
    runs-on: ubuntu-latest
    # The DB-backed tests (migrations, upsert, dedupe, the full crawl flow) skip
    # themselves unless EVCRAWL_TEST_DATABASE_URL points at a database named
    # <something>_scratch, so without this service a third of the suite never ran
    # here and a broken migration reached main green. Same image as the stack's
    # `db`, thrown away with the job; `--network host` below is what lets the
    # gates container reach it on localhost. `ci_shared` stands in for the
    # shared database: the superuser migrates it as release.sh does, which
    # creates the `team` role (F-014); the checks and the tests then run as
    # `team` on a `team_scratch` it creates itself, exactly as a member does.
    services:
      scratch-db:
        image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
        env:
          POSTGRES_USER: evcrawl
          POSTGRES_PASSWORD: evcrawl
          POSTGRES_DB: ci_shared
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evcrawl -d ci_shared"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          tags: evcrawl-dev:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run gates inside the dev image
        run: |
          docker run --rm --network host -v "$PWD:/work" -w /work \
            -e UV_PROJECT_ENVIRONMENT=/tmp/venv \
            -e EVCRAWL_TEST_DATABASE_URL=postgresql+psycopg://team:team@localhost:5432/team_scratch \
            -e EVCRAWL_REQUIRE_TEST_DATABASE=1 \
            --entrypoint bash evcrawl-dev:ci -c '
              set -euo pipefail
              uv sync --frozen
              uv run ruff check .
              uv run ruff format --check .
              uv run mypy
              DATABASE_URL=postgresql+psycopg://evcrawl:evcrawl@localhost:5432/ci_shared \
                TEAM_DB_PASSWORD=team uv run evcrawl migrate
              export PGHOST=localhost PGUSER=team PGPASSWORD=team PGDATABASE=ci_shared
              bash ops/db/team-role-checks.sh
              createdb -T template_postgis team_scratch
              uv run pytest -q -rs
            '


  runtime-image:
    name: runtime image
    if: github.event.action != 'labeled' || github.event.label.name == 'automerge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: evcrawl:ci
          load: true
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm evcrawl:ci --help
          docker run --rm evcrawl:ci version

  # Merges a pull request into main once both checks above pass, but only when a
  # reviewer or an agent put the `automerge` label on it (AGENTS.md §11), and
  # removing it holds the PR. The job deletes the head branch itself: the
  # repository's delete-on-merge setting only fires for merges made by a person,
  # not for one made with the workflow token (seen on PR #24). A merge made with
  # the workflow token does not start the push-to-main run of this workflow
  # either; the checks already ran on the PR's merge ref.
  automerge:
    name: automerge (label)
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'automerge')
    needs: [gates-in-dev-image, runtime-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --repo "${{ github.repository }}" --merge --delete-branch
