name: release

# Publishes the `runtime` image (ADR 0001, AGENTS.md §9) when a semver tag is
# pushed. Two image tags per release: the git tag and the short git SHA.
# `latest` is never produced. A `-dev.N` / `-rc.N` pre-release suffix marks a
# build that is not meant to run as the host's `evcrawl` service yet.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/evcrawl

jobs:
  publish-runtime:
    name: publish runtime image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only commits that CI already gated on main may become a release.
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Resolve tags
        id: rev
        run: |
          short="$(git rev-parse --short "$GITHUB_SHA")"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ steps.rev.outputs.short }}
          build-args: GIT_SHA=${{ steps.rev.outputs.short }}
          labels: |
            org.opencontainers.image.version=${{ steps.rev.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        run: |
          docker pull "$IMAGE:$GITHUB_REF_NAME"
          out="$(docker run --rm "$IMAGE:$GITHUB_REF_NAME" version)"
          echo "$out"
          case "$out" in *"(${{ steps.rev.outputs.short }})") ;; *) echo "revision mismatch" >&2; exit 1 ;; esac
