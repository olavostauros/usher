# Wiring for the hosted team workspace (AGENTS.md §4) and the release image.
#   host owner:  docker compose up -d db redis nominatim dev grafana api cloudflared
#   members:     ssh -p 2222 <login>@<host-tailnet-name>
#   migrations:  ops/host/release.sh   (its one-off `migrate`, never on boot)
name: usher

services:
  # `evcrawl` is the cluster superuser: the release container (migrate, the
  # scheduler) connects as it, members never do. They log in as `team`, which
  # `evcrawl migrate` creates and grants (F-014, src/evcrawl/db/roles.py).
  # POSTGRES_PASSWORD only initialises an empty volume; on an existing one the
  # owner changes it with `alter role` from db's own environment
  # (ops/host/README.md, "Database roles").
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: evcrawl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: evcrawl
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # F-024: every member's SQL, every Grafana panel and the scheduler run
    # here, so a runaway query hits this ceiling, not the host's memory.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:  # the entrypoint chowns its data, then drops to its user
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-4g}
          pids: 1024
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evcrawl -d evcrawl"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:  # the entrypoint chowns its data, then drops to its user
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-512m}
          pids: 128
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Self-hosted geocoder (docs/specs/phase-3-national.md §3): imports the
  # Geofabrik Brazil extract on first start (hours; see ops/host/README.md,
  # "Geocoder"), then serves the Nominatim API on 8080 inside the compose
  # network only. Nothing depends on it being healthy: an unreachable geocoder
  # is `geocode.unavailable` in the pipeline (nothing cached, retried next run),
  # so the workspace and the scheduler start while the import is still running.
  # `restart: unless-stopped` resumes a stopped import; a finished one is kept
  # on the `nominatim` volume (the image's import-finished marker), which is not
  # backed up because it is reproducible from the PBF.
  nominatim:
    image: mediagis/nominatim:5.3
    environment:
      # A clipped import (ops/host/README.md "Clipped") sets NOMINATIM_PBF_URL=
      # (empty: the image would download it and then delete the PBF_PATH file)
      # and NOMINATIM_PBF_PATH=/pbf/brazil-metros.osm.pbf.
      PBF_URL: ${NOMINATIM_PBF_URL-https://download.geofabrik.de/south-america/brazil-latest.osm.pbf}
      PBF_PATH: ${NOMINATIM_PBF_PATH:-}
      IMPORT_STYLE: address
      # No REPLICATION_URL: a refresh is a reimport, so the osm2pgsql update
      # tables (most of an unfrozen import's disk) are dropped after it.
      FREEZE: "true"
      THREADS: ${NOMINATIM_THREADS:-4}
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?set NOMINATIM_PASSWORD in .env}
      # The image defaults (2GB / 10GB / 24GB) assume a dedicated server; these
      # fit a personal computer. Raise them in .env for a faster import.
      POSTGRES_SHARED_BUFFERS: ${NOMINATIM_SHARED_BUFFERS:-1GB}
      POSTGRES_MAINTENANCE_WORK_MEM: ${NOMINATIM_MAINTENANCE_WORK_MEM:-4GB}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${NOMINATIM_EFFECTIVE_CACHE_SIZE:-8GB}
    shm_size: ${NOMINATIM_SHM_SIZE:-1g}
    volumes:
      - nominatim:/var/lib/postgresql/16/main
      - ./ops/host/nominatim/pbf:/pbf:ro
    restart: unless-stopped
    # F-024: the cap counts /dev/shm, so it must stay above shared_buffers +
    # maintenance_work_mem + shm_size (1GB + 4GB + 1g with the defaults).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:  # the entrypoint chowns its data, then drops to its user
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - AUDIT_WRITE  # start.sh uses sudo, which writes an audit record
    deploy:
      resources:
        limits:
          memory: ${NOMINATIM_MEMORY_LIMIT:-8g}
          pids: 1024
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 12h   # the first start is the import

  # The team workspace: one long-running container, sshd on port 22 inside,
  # published on the host ONLY at DEV_SSH_BIND (the Tailscale IPv4). The
  # default 127.0.0.1 means a missing variable never exposes it.
  dev:
    build:
      context: .
      target: dev
    image: evcrawl-dev:local
    hostname: evcrawl-dev
    # Members' sessions get these (team/entrypoint.sh): the non-superuser
    # `team` role, never the superuser's URL from .env (F-014). No env_file:
    # the host .env holds secrets nobody here uses (F-026). A bare name takes
    # its value from .env and stays unset when .env has none.
    environment:
      DATABASE_URL: postgresql+psycopg://team:${TEAM_DB_PASSWORD:?set TEAM_DB_PASSWORD in .env}@db:5432/evcrawl
      PGUSER: team
      PGPASSWORD: ${TEAM_DB_PASSWORD:?set TEAM_DB_PASSWORD in .env}
      REDIS_URL:
      NOMINATIM_URL:
      LOG_LEVEL:
      EVCRAWL_CONTACT_EMAIL:
      EVCRAWL_USER_AGENT:
      EVCRAWL_GEOCODE_RPS:
      EVCRAWL_GEOCODE_FALLBACK_URL:
    init: true
    restart: unless-stopped
    ports:
      - "${DEV_SSH_BIND:-127.0.0.1}:2222:22"
    volumes:
      - homes:/home
      - sshhost:/etc/ssh/host_keys
    tmpfs:
      - /tmp:size=4g,mode=1777
    # Guardrails for people and their coding agents (AGENTS.md §4, "Agents"):
    # no privilege escalation, only the capabilities sshd/useradd need, no
    # docker socket, and hard caps so one runaway job cannot take the host.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - SETGID
      - SETUID
      - SETPCAP
      - SYS_CHROOT
      - AUDIT_WRITE
      - KILL
    deploy:
      resources:
        limits:
          memory: ${DEV_MEMORY_LIMIT:-16g}
          cpus: "${DEV_CPU_LIMIT:-12}"
          pids: 4096
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The release image, for running the scheduler or one-off commands here.
  # `restart: unless-stopped` keeps the scheduler crawling across daemon and
  # host restarts once the owner has started it (ops/host/release.sh); a
  # `docker compose stop evcrawl` still holds it down until started again.
  evcrawl:
    build:
      context: .
      target: runtime
    image: evcrawl:dev
    # The superuser: `migrate` needs it to create roles and grant them. No
    # env_file (F-026): the scheduler parses untrusted pages, so it gets only
    # what the pipeline reads. The role passwords (GRAFANA_DB_PASSWORD,
    # TEAM_DB_PASSWORD) go to the migrate one-off alone, as `-e` on its
    # command line (ops/host/release.sh).
    environment:
      DATABASE_URL: postgresql+psycopg://evcrawl:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/evcrawl
      REDIS_URL:
      NOMINATIM_URL:
      LOG_LEVEL:
      EVCRAWL_CONTACT_EMAIL:
      EVCRAWL_USER_AGENT:
      EVCRAWL_GEOCODE_RPS:
      EVCRAWL_GEOCODE_FALLBACK_URL:
    restart: unless-stopped
    # F-024: the runtime image runs as a non-root user and needs no capability.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: ${EVCRAWL_MEMORY_LIMIT:-2g}
          pids: 512
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The events API (docs/specs/phase-4-api.md, ADR 0014; the PWA's contract is
  # docs/api/README.md): the same release image as the scheduler, one build
  # and one git SHA, running `evcrawl api` on 8000 inside and published on the
  # host ONLY at DEV_SSH_BIND, like sshd and Grafana (a missing variable binds
  # 127.0.0.1). It logs in as the read-only `api_ro` role (SELECT on the api_*
  # views and nothing else, migration 0008; the migrate one-off applies
  # EVCRAWL_API_DB_PASSWORD to it), never as `evcrawl`: no env_file (F-026),
  # and the list below is everything the API reads, so this container never
  # holds DATABASE_URL or another role's password. No auth in v1: the data is
  # public; the port is tailnet-only and the public host is the `cloudflared`
  # tunnel below (spec task 5), which reaches this service inside the compose
  # network. The image is built by the `evcrawl` service (ops/host/release.sh,
  # which also recreates this one); the healthcheck is /healthz, a 503 once
  # api_ro cannot log in.
  api:
    image: evcrawl:dev
    command: ["api", "--host", "0.0.0.0"]
    environment:
      EVCRAWL_API_DATABASE_URL: postgresql+psycopg://api_ro:${EVCRAWL_API_DB_PASSWORD:?set EVCRAWL_API_DB_PASSWORD in .env}@db:5432/evcrawl
      # The site's origin (CORS, evcrawl.api.cors) and the proxy flag (the rate
      # limiter keys on the address Cloudflare appends to X-Forwarded-For) are
      # the defaults here so a release carries them; .env overrides them, and
      # EVCRAWL_API_TRUST_PROXY=0 there would put every public client in one
      # bucket (ops/host/README.md "Public exposure").
      EVCRAWL_API_CORS_ORIGINS: ${EVCRAWL_API_CORS_ORIGINS:-https://eventolivre.com}
      EVCRAWL_API_TRUST_PROXY: ${EVCRAWL_API_TRUST_PROXY:-1}
      LOG_LEVEL:
    restart: unless-stopped
    ports:
      - "${DEV_SSH_BIND:-127.0.0.1}:8000:8000"
    # F-024: non-root image, no capability needed; a query storm hits this cap.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-512m}
          pids: 256
    healthcheck:
      # The runtime image has no curl; urlopen raises on anything but 2xx.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  # Public exposure of the events API (spec task 5, ADR 0015): a Cloudflare
  # Tunnel from this compose network to Cloudflare's edge, which serves
  # https://api.eventolivre.com with its own certificate and forwards to
  # http://api:8000 here. Outbound only: nothing new listens on the host and
  # DEV_SSH_BIND stays the only published address. The ingress rules are
  # ops/host/cloudflared/config.yml (committed); the tunnel credentials are
  # ops/host/cloudflared/credentials.json (gitignored, written by `cloudflared
  # tunnel create`) and its id is CLOUDFLARE_TUNNEL_ID in .env
  # (ops/host/README.md "Public exposure"). Tag plus multi-arch index digest,
  # like grafana (F-022); bump both together.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - --metrics
      - 127.0.0.1:2000
      - run
      - ${CLOUDFLARE_TUNNEL_ID:-unset-see-ops-host-README}
    volumes:
      - ./ops/host/cloudflared:/etc/cloudflared:ro
    restart: unless-stopped
    # The host owner's uid:gid, so credentials.json can stay mode 600 on the
    # host; the image's own `nonroot` user could not read it.
    user: ${CLOUDFLARED_USER:-1000:1000}
    # F-024: no capability needed.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: ${CLOUDFLARED_MEMORY_LIMIT:-256m}
          pids: 128
    healthcheck:
      # `tunnel ready` asks the metrics endpoint whether a connection to the
      # edge is up; it exits non-zero while the tunnel is registering.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - api

  # Monitoring dashboards (docs/specs/phase-3-monitoring.md §3): Grafana OSS
  # reading the shared db through the monitoring views as the read-only
  # `grafana_ro` role, everything provisioned from ops/grafana/ (datasource,
  # provider, dashboards; UI edits are off, dashboards change by PR). Anyone
  # on the tailnet is an anonymous Viewer; `admin` (GRAFANA_ADMIN_PASSWORD)
  # exists only for "Save & test" on the datasource. Published on the host
  # ONLY at DEV_SSH_BIND, like sshd: the default 127.0.0.1 means a missing
  # variable never exposes it. The `grafana` volume is its own state
  # (sessions, the admin user) and is not backed up: everything that matters
  # is in the repository.
  # grafana/grafana is the OSS build; grafana/grafana-oss stopped at 13.0.2.
  # Tag plus multi-arch index digest (F-022, F-002); bump both together.
  grafana:
    image: grafana/grafana:13.0.9@sha256:c26daa778ea9fd817be3fe606ba4b78ea4c217a7a27c1ba8f5faa4418ecc48dd
    restart: unless-stopped
    # F-024: runs as uid 472 on port 3000 and needs no capability.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT:-1g}
          pids: 256
    ports:
      - "${DEV_SSH_BIND:-127.0.0.1}:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # F-023: nobody uses snapshots or public dashboards; keep admin from making one.
      GF_SNAPSHOTS_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      # Expanded by Grafana inside ops/grafana/provisioning/datasources/evcrawl.yml.
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    volumes:
      - grafana:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  homes:
  sshhost:
  nominatim:
  grafana:
