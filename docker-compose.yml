# Wiring for the hosted team workspace (AGENTS.md §4) and the release image.
#   host owner:  docker compose up -d db redis nominatim dev
#   members:     ssh -p 2222 <login>@<host-tailnet-name>
#   migrations:  docker compose run --rm evcrawl migrate   (one-off, never on boot)
name: usher

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: evcrawl
      POSTGRES_PASSWORD: evcrawl
      POSTGRES_DB: evcrawl
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evcrawl -d evcrawl"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Self-hosted geocoder (docs/specs/phase-3-national.md §3): imports the
  # Geofabrik Brazil extract on first start (hours; see ops/host/README.md,
  # "Geocoder"), then serves the Nominatim API on 8080 inside the compose
  # network only. Nothing depends on it being healthy: an unreachable geocoder
  # is `geocode.unavailable` in the pipeline (nothing cached, retried next run),
  # so the workspace and the scheduler start while the import is still running.
  # `restart: unless-stopped` resumes a stopped import; a finished one is kept
  # on the `nominatim` volume (the image's import-finished marker), which is not
  # backed up because it is reproducible from the PBF.
  nominatim:
    image: mediagis/nominatim:5.3
    environment:
      PBF_URL: ${NOMINATIM_PBF_URL:-https://download.geofabrik.de/south-america/brazil-latest.osm.pbf}
      IMPORT_STYLE: address
      THREADS: ${NOMINATIM_THREADS:-4}
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?set NOMINATIM_PASSWORD in .env}
      # The image defaults (2GB / 10GB / 24GB) assume a dedicated server; these
      # fit a personal computer. Raise them in .env for a faster import.
      POSTGRES_SHARED_BUFFERS: ${NOMINATIM_SHARED_BUFFERS:-1GB}
      POSTGRES_MAINTENANCE_WORK_MEM: ${NOMINATIM_MAINTENANCE_WORK_MEM:-4GB}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${NOMINATIM_EFFECTIVE_CACHE_SIZE:-8GB}
    shm_size: ${NOMINATIM_SHM_SIZE:-1g}
    volumes:
      - nominatim:/var/lib/postgresql/16/main
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 12h   # the first start is the import

  # The team workspace: one long-running container, sshd on port 22 inside,
  # published on the host ONLY at DEV_SSH_BIND (the Tailscale IPv4). The
  # default 127.0.0.1 means a missing variable never exposes it.
  dev:
    build:
      context: .
      target: dev
    image: evcrawl-dev:local
    hostname: evcrawl-dev
    env_file: .env
    init: true
    restart: unless-stopped
    ports:
      - "${DEV_SSH_BIND:-127.0.0.1}:2222:22"
    volumes:
      - homes:/home
      - sshhost:/etc/ssh/host_keys
    tmpfs:
      - /tmp:size=4g,mode=1777
    # Guardrails for people and their coding agents (AGENTS.md §4, "Agents"):
    # no privilege escalation, only the capabilities sshd/useradd need, no
    # docker socket, and hard caps so one runaway job cannot take the host.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - SETGID
      - SETUID
      - SETPCAP
      - SYS_CHROOT
      - AUDIT_WRITE
      - KILL
    deploy:
      resources:
        limits:
          memory: ${DEV_MEMORY_LIMIT:-16g}
          cpus: "${DEV_CPU_LIMIT:-12}"
          pids: 4096
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The release image, for running the scheduler or one-off commands here.
  # `restart: unless-stopped` keeps the scheduler crawling across daemon and
  # host restarts once the owner has started it (ops/host/release.sh); a
  # `docker compose stop evcrawl` still holds it down until started again.
  evcrawl:
    build:
      context: .
      target: runtime
    image: evcrawl:dev
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  homes:
  sshhost:
  nominatim:
