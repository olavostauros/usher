[project]
name = "evcrawl"
version = "0.1.0"
description = "Evento Livre event crawler: keeps a PostgreSQL + PostGIS database of upcoming events."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "geoalchemy2>=0.15",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "rq>=1.16",
    "selectolax>=0.3.21",
    "sqlalchemy>=2.0",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.scripts]
evcrawl = "evcrawl.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evcrawl"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"ops/audit/*.py" = ["E501"]  # finding text is prose; wrapping it hurts the report

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["evcrawl"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "geoalchemy2.*", "rq.*", "selectolax.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
